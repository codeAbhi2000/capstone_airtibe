function getDepth(name) {
  const parts = name.split('/').filter(Boolean);
  return Math.max(0, parts.length - 1);
}

function getShortName(name) {
  const parts = name.split('/').filter(Boolean);
  return (name.endsWith('/') ? parts[parts.length-1]+'/' : parts[parts.length-1]);
}

function isLast(items, idx) {
  for (let i = idx+1; i < items.length; i++) {
    if (getDepth(items[i].n) <= getDepth(items[idx].n)) return true;
  }
  return true;
}

function buildTree(items, containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  const openState = {};
  let idCounter = 0;

  function render() {
    container.innerHTML = '';
    let skipDepth = -1;

    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      const depth = getDepth(item.n);
      const shortName = getShortName(item.n);
      const isDir = item.t === 'dir';
      const id = 'node-'+containerId+i;

      if (skipDepth >= 0 && depth > skipDepth) continue;
      if (skipDepth >= 0 && depth <= skipDepth) skipDepth = -1;

      if (isDir && openState[item.n] === false) {
        skipDepth = depth;
      }

      const row = document.createElement('div');
      row.className = 'row' + (isDir ? ' clickable' : '');
      row.id = id;

      let html = '';
      for (let d = 0; d < depth; d++) {
        html += `<span class="indent">│</span>`;
      }
      html += `<span class="branch">${depth > 0 ? '├ ' : ''}</span>`;

      if (isDir) {
        const isOpen = openState[item.n] !== false;
        html += `<span class="toggle ${isOpen ? 'open' : ''}" id="tgl-${id}">›</span>`;
        html += `<span class="icon">📁</span>`;
        html += `<span class="name dir">${shortName}</span>`;
      } else {
        html += `<span class="toggle" style="visibility:hidden">›</span>`;
        html += `<span class="icon">${item.i || '📄'}</span>`;
        html += `<span class="name ${depth===0?'entry':'file'}">${shortName}</span>`;
      }

      if (item.b) html += `<span class="badge ${item.b}">${item.b==='b-blue'?'Next.js':item.b==='b-purple'?'Node':item.b==='b-teal'?'Python':item.b==='b-amber'?'Shared':'Root'}</span>`;
      if (item.d) html += `<span class="detail">— ${item.d}</span>`;

      row.innerHTML = html;

      const tipText = TIPS[item.n];
      if (tipText) {
        row.addEventListener('mouseenter', (e) => showTip(e, tipText));
        row.addEventListener('mousemove', moveTip);
        row.addEventListener('mouseleave', hideTip);
      }

      if (isDir) {
        row.addEventListener('click', () => {
          openState[item.n] = openState[item.n] === false ? true : false;
          render();
        });
      }

      container.appendChild(row);
    }
  }

  render();
}

const tip = document.getElementById('tip');
function showTip(e, text) {
  tip.textContent = text;
  tip.style.display = 'block';
  moveTip(e);
}
function moveTip(e) {
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top = (e.clientY - 10) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

buildTree(FULL, 'tree-all');
buildTree(FE_ONLY, 'tree-fe');
buildTree(NODE_ONLY, 'tree-node');
buildTree(PY_ONLY, 'tree-py');
</script>
